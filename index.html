<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙再生クリッカー</title>
    <style>
        body {
            background-color: #0b111e;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #left-panel {
            flex: 1;
            background: linear-gradient(135deg, #0f172a, #0b111e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border-right: 2px solid #1e293b;
        }
        #right-panel {
            width: 450px;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #1e293b;
        }
        .autoclicker-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #111827;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #4b5563; transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #eab308; }
        input:checked + .slider:before { transform: translateX(24px); }
        .autoclicker-info { font-size: 12px; color: #9ca3af; }
        .autoclicker-info div:first-child { color: #f3f4f6; font-weight: bold; font-size: 13px; }
        
        #stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        #coin-display {
            font-size: 48px;
            font-weight: bold;
            color: #f6e05e;
            text-shadow: 0 0 15px rgba(246,224,94,0.3);
        }
        .sub-stats {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 5px;
            line-height: 1.6;
        }
        
        #click-btn-container {
            position: relative;
            width: 260px;
            height: 260px;
        }
        #click-btn {
            width: 100%;
            height: 100%;
            background-color: #ecc94b;
            border-radius: 50%;
            border: 8px solid #d69e2e;
            box-shadow: 0 10px 25px rgba(214,158,46,0.4), inset 0 -8px 0 rgba(0,0,0,0.15);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.05s ease;
        }
        #click-btn:after {
            content: "×";
            font-size: 64px;
            color: #1a202c;
            font-weight: bold;
        }
        
        @keyframes pulseFast {
            0% { transform: scale(1); }
            50% { transform: scale(0.96); }
            100% { transform: scale(1); }
        }
        .btn-pulse { animation: pulseFast 0.04s ease infinite; }
        .btn-active { transform: scale(0.9) !important; }
        
        #particle-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            width: 300px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stack-particle {
            position: absolute;
            color: #f6e05e;
            font-weight: bold;
            font-size: 28px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 10px #ecc94b;
            animation: stackAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            white-space: nowrap;
        }
        @keyframes stackAnim {
            0% { transform: scale(0.6) translateY(10px); opacity: 0; }
            50% { transform: scale(1.2) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        
        #space-hint {
            position: absolute;
            bottom: 30px;
            font-size: 13px;
            color: #6b7280;
            background-color: rgba(17,24,39,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #1e293b;
        }
        
        #tabs {
            display: flex;
            background-color: #111827;
            border-bottom: 2px solid #1e293b;
        }
        .tab {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #9ca3af;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab:hover { color: #f3f4f6; }
        .tab.active {
            color: #ecc94b;
            border-bottom: 2px solid #ecc94b;
            background-color: rgba(236,201,75,0.05);
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }
        .panel-content.active { display: block; }
        
        .list-item {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .list-item:hover { border-color: #374151; }
        .item-info { flex: 1; padding-right: 15px; }
        .item-title { font-weight: bold; font-size: 15px; color: #f3f4f6; margin-bottom: 4px; }
        .item-desc { font-size: 12px; color: #9ca3af; line-height: 1.4; }
        .item-lv { font-size: 11px; color: #ecc94b; font-weight: bold; margin-top: 2px; }
        
        .action-btn {
            background-color: #1d4ed8;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            min-width: 140px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.1s;
        }
        .action-btn:hover:not(:disabled) { background-color: #2563eb; }
        .action-btn:active:not(:disabled) { transform: scale(0.95); }
        .action-btn:disabled {
            background-color: #374151;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }
        .reverse-btn { background-color: #7c3aed; }
        .reverse-btn:hover:not(:disabled) { background-color: #8b5cf6; }
        .gacha-btn { background-color: #059669; }
        .gacha-btn:hover:not(:disabled) { background-color: #10b981; }
        
        .pet-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .pet-card {
            background-color: #111827;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            position: relative;
        }
        .rarity-badge {
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .rarity-common { background-color: #4b5563; color: #f3f4f6; }
        .rarity-rare { background-color: #2563eb; color: #ffffff; }
        .rarity-epic { background-color: #7c3aed; color: #ffffff; }
        .rarity-legend { background-color: #d97706; color: #ffffff; }
        .rarity-mythic { background-color: #dc2626; color: #ffffff; }
        .rarity-godly { background-color: #db2777; color: #ffffff; }
        .rarity-secret { background-color: #4f46e5; color: #ffffff; box-shadow: 0 0 8px #4f46e5; }
        .rarity-eternal { background-color: #b45309; color: #fef08a; box-shadow: 0 0 12px #b45309; border: 1px solid #fef08a; }
        
        .pet-name { font-weight: bold; font-size: 13px; color: #f3f4f6; margin-bottom: 4px; }
        .pet-mult { font-size: 11px; color: #10b981; font-weight: bold; }
        .pet-count { position: absolute; top: 8px; right: 8px; font-size: 10px; color: #6b7280; }
        .pet-card.locked { opacity: 0.4; }
        
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 480px;
            z-index: 1000;
            pointer-events: none;
        }
        .toast {
            background-color: #1f2937;
            color: #f3f4f6;
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.3s ease forwards, toastOut 0.3s ease 1.5s forwards;
        }
        @keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-20px); opacity: 0; } }
    </style>
</head>
<body>

    <div id="left-panel">
        <div class="autoclicker-container">
            <label class="toggle-switch">
                <input type="checkbox" id="autoclick-toggle">
                <span class="slider"></span>
            </label>
            <div class="autoclicker-info">
                <div>AUTO CLICKER</div>
                <div id="autoclick-speed-text">速度: 秒間0回</div>
            </div>
        </div>

        <div id="stats-container">
            <div id="coin-display">0.00 コイン</div>
            <div class="sub-stats">
                秒間自動生産 (CPS): <span id="cps-text" style="color: #63b3ed;">0.00</span><br>
                1クリック: <span id="cpc-text" style="color: #48bb78;">1.00</span><br>
                永続生産倍率: <span id="mult-text" style="color: #9f7aea;">x1.00</span><br>
                再生回数: <span id="reverse-text" style="color: #ed64a6;">0</span> 回
            </div>
        </div>

        <div id="click-btn-container">
            <button id="click-btn"></button>
            <div id="particle-area"></div>
        </div>

        <div id="space-hint">【スペースキー】長押しで超高速自動連打！</div>
    </div>

    <div id="right-panel">
        <div id="tabs">
            <div class="tab active" onclick="switchTab('upgrade')">無限強化</div>
            <div class="tab" onclick="switchTab('reverse')">宇宙再生</div>
            <div class="tab" onclick="switchTab('gacha')">卵・ガチャ</div>
            <div class="tab" onclick="switchTab('pets')">相棒・図鑑</div>
        </div>

        <!-- 無限強化 -->
        <div id="tab-upgrade" class="panel-content active"></div>

        <!-- 宇宙再生 -->
        <div id="tab-reverse" class="panel-content"></div>

        <!-- ガチャ -->
        <div id="tab-gacha" class="panel-content"></div>

        <!-- 相棒図鑑 -->
        <div id="tab-pets" class="panel-content">
            <div style="font-size: 14px; margin-bottom: 15px; color: #9ca3af; display: flex; justify-content: space-between;">
                <span>現在の最高相棒倍率: <span id="best-pet-mult" style="color: #10b981; font-weight: bold;">x1.00</span></span>
                <span>図鑑解放数: <span id="dex-count">0</span>/1000 (<span id="dex-percent">0.0</span>%)</span>
            </div>
            <div class="pet-grid" id="pet-list-container"></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // 大数表記定義
        const UNITS = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Ocd", "Nod", "Vg"];
        const MAX_COIN = 1e60; // Novemdecillion 10^60

        // ゲーム状態
        let game = {
            coins: 0,
            reverseCount: 0,
            upgrades: { click: 1, auto: 0, multiplier: 1, speed: 1 },
            unlockedPets: {} // petId: count
        };

        // レアリティ定義
        const RARITIES = [
            { name: "コモン", key: "common", mult: 1.5, weight: 50 },
            { name: "レア", key: "rare", mult: 3, weight: 25 },
            { name: "エピック", key: "epic", mult: 8, weight: 13 },
            { name: "レジェンド", key: "legend", mult: 25, weight: 7 },
            { name: "ミシック", key: "mythic", mult: 100, weight: 3.5 },
            { name: "ゴッドリー", key: "godly", mult: 500, weight: 1.2 },
            { name: "シークレット", key: "secret", mult: 5000, weight: 0.25 },
            { name: "エターナル", key: "eternal", mult: 100000, weight: 0.05 }
        ];

        // 1000体ペット生成システム
        const petsData = [];
        const petNamesPool = {
            common: ["スライム", "プチ犬", "コトリ", "おたま", "ヒヨコ", "ミニロボ"],
            rare: ["ウサギ", "タヌキ", "キツネ", "エレキウオ", "アイアンコア"],
            epic: ["ウルフ", "グリフォン", "ヘルハウンド", "サイバーキャット"],
            legend: ["ドラゴン", "フェニックス", "ペガサス", "タイタン", "機神"],
            mythic: ["滅龍", "不死鳥", "大天使", "魔王", "ノヴァコア"],
            godly: ["ゼウス", "オーディン", "アマテラス", "ボイドドラゴン"],
            secret: ["創造神", "終焉の使者", "クロノス", "インフィニティ"],
            eternal: ["コスモ・フェニックス", "ユニバース・コア", "ステラ・ゴッド"]
        };

        // 30個の卵と1000体のマッピング
        for(let e = 1; e <= 30; e++) {
            let petCountForEgg = (e === 30) ? 41 : 33; // 合計1000体にするための調整
            for(let p = 1; p <= petCountForEgg; p++) {
                let id = petsData.length + 1;
                let rarityIndex = 0;
                if(p > 30) rarityIndex = 7;
                else if(p > 28) rarityIndex = 6;
                else if(p > 25) rarityIndex = 5;
                else if(p > 20) rarityIndex = 4;
                else if(p > 15) rarityIndex = 3;
                else if(p > 10) rarityIndex = 2;
                else if(p > 5) rarityIndex = 1;

                let rarity = RARITIES[rarityIndex];
                let pool = petNamesPool[rarity.key];
                let baseName = pool[(id % pool.length)];
                
                // 卵のレベルが上がるほど、ベースとなるベース能力に超強力なバフ
                let eggBonus = Math.pow(4, e - 1);
                let finalMult = rarity.mult * eggBonus;

                petsData.push({
                    id: id,
                    eggLevel: e,
                    name: `${rarity.name}・${baseName} Lv.${id}`,
                    rarity: rarity.key,
                    rarityName: rarity.name,
                    multiplier: finalMult
                });
            }
        }

        // フォーマット関数（小数点以下を適切に処理）
        function format(num) {
            if (num >= MAX_COIN) return "Novemdecillion";
            if (num < 1000) return num.toFixed(2);
            const exp = Math.floor(Math.log10(num) / 3);
            const unitIndex = Math.min(exp, UNITS.length - 1);
            const value = num / Math.pow(10, unitIndex * 3);
            return `${value.toFixed(2)} ${UNITS[unitIndex]}`;
        }

        // 各種計算
        function getBestPetMultiplier() {
            let maxMult = 1.0;
            for(let id in game.unlockedPets) {
                if(game.unlockedPets[id] > 0) {
                    let pet = petsData[id - 1];
                    if(pet && pet.multiplier > maxMult) maxMult = pet.multiplier;
                }
            }
            return maxMult;
        }

        function getGlobalMultiplier() {
            // リバース補正：1回ごとに大きなバフ
            let reverseBonus = 1 + game.reverseCount * 59.60;
            return game.upgrades.multiplier * reverseBonus * getBestPetMultiplier();
        }

        function getCPC() {
            return game.upgrades.click * getGlobalMultiplier();
        }

        function getCPS() {
            return game.upgrades.auto * getGlobalMultiplier();
        }

        function getAutoclickInterval() {
            // レベルに応じて極限までクロックを加速
            return Math.max(1, Math.floor(1000 / (10 + game.upgrades.speed * 2)));
        }

        // コイン追加＆上限チェック
        function addCoins(amount) {
            game.coins += amount;
            if(game.coins > MAX_COIN) game.coins = MAX_COIN;
            updateUI();
        }

        // スタックパーティクル処理
        let currentStackValue = 0;
        let particleTimeout = null;
        let particleElement = null;

        function showStackParticle(value) {
            currentStackValue += value;
            const area = document.getElementById("particle-area");
            
            if (!particleElement) {
                particleElement = document.createElement("div");
                particleElement.className = "stack-particle";
                area.appendChild(particleElement);
            }
            
            particleElement.innerText = `+${format(currentStackValue)}`;
            
            // アニメーションのリセットと再適用
            particleElement.style.animation = 'none';
            particleElement.offsetHeight; 
            particleElement.style.animation = 'stackAnim 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards';

            clearTimeout(particleTimeout);
            particleTimeout = setTimeout(() => {
                if(particleElement) {
                    particleElement.remove();
                    particleElement = null;
                }
                currentStackValue = 0;
            }, 500);
        }

        // クリック実行
        function doClick() {
            const gain = getCPC();
            addCoins(gain);
            showStackParticle(gain);
        }

        // メインスレッド側のオートクリック駆動ループ
        let lastAutoclickTime = 0;
        function updateAutoclickLoop(timestamp) {
            if (document.getElementById("autoclick-toggle").checked || isSpacePressed) {
                const interval = getAutoclickInterval();
                if (!lastAutoclickTime) lastAutoclickTime = timestamp;
                const elapsed = timestamp - lastAutoclickTime;

                if (elapsed >= interval) {
                    // 超高速クロックの場合は、1フレームに複数回分を合算して処理
                    const ticks = Math.floor(elapsed / interval);
                    const gain = getCPC() * ticks;
                    addCoins(gain);
                    showStackParticle(gain);
                    lastAutoclickTime = timestamp - (elapsed % interval);
                }
            } else {
                lastAutoclickTime = 0;
            }
            requestAnimationFrame(updateAutoclickLoop);
        }

        // アニメーション制御（オートクリック・スペース長押し中にボタンを震わせる）
        function updateButtonPulse() {
            const isRunning = document.getElementById("autoclick-toggle").checked || isSpacePressed;
            const btn = document.getElementById("click-btn");
            if (isRunning) {
                btn.classList.add("btn-pulse");
            } else {
                btn.classList.remove("btn-pulse");
            }
        }

        // キーボード操作設定
        let isSpacePressed = false;
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                if(!isSpacePressed) {
                    isSpacePressed = true;
                    updateButtonPulse();
                    document.getElementById("click-btn").classList.add("btn-active");
                }
            }
        });
        window.addEventListener("keyup", (e) => {
            if (e.code === "Space") {
                isSpacePressed = false;
                updateButtonPulse();
                document.getElementById("click-btn").classList.remove("btn-active");
            }
        });

        // タブ切り替え
        function switchTab(tabName) {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".panel-content").forEach(p => p.classList.remove("active"));
            event.target.classList.add("active");
            document.getElementById(`tab-${tabName}`).classList.add("active");
        }

        // 各種データ定義とレンダリング生成
        const upgradeSpecs = [
            { key: "click", name: "1クリック強化", desc: "1クリックのパワーを直接増加させます", baseCost: 10, costMult: 1.4 },
            { key: "auto", name: "秒間自動生産", desc: "クリックしなくても自動でコインを生産します", baseCost: 50, costMult: 1.5 },
            { key: "multiplier", name: "生産倍率", desc: "全体の生産効率をパーセンテージで乗算します", baseCost: 200, costMult: 1.6 },
            { key: "speed", name: "連打速度", desc: "オートクリッカーマクロの秒間稼働速度を強化します", baseCost: 100, costMult: 1.7 }
        ];

        function getUpgradeCost(key, lv) {
            const spec = upgradeSpecs.find(s => s.key === key);
            return spec.baseCost * Math.pow(spec.costMult, lv - (key === 'click' ? 1 : 0));
        }

        function buyUpgrade(key) {
            let currentLv = game.upgrades[key];
            let cost = getUpgradeCost(key, currentLv);
            if (game.coins >= cost) {
                game.coins -= cost;
                game.upgrades[key]++;
                saveGame();
                renderUpgrades();
                updateUI();
            }
        }

        function renderUpgrades() {
            const container = document.getElementById("tab-upgrade");
            container.innerHTML = "";
            upgradeSpecs.forEach(spec => {
                let lv = game.upgrades[spec.key];
                let cost = getUpgradeCost(spec.key, lv);
                let canBuy = game.coins >= cost;
                
                container.innerHTML += `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-title">${spec.name}</div>
                            <div class="item-desc">${spec.desc}</div>
                            <div class="item-lv">Lv.${lv}</div>
                        </div>
                        <button class="action-btn" ${canBuy ? '' : 'disabled'} onclick="buyUpgrade('${spec.key}')">
                            ${format(cost)} コイン
                        </button>
                    </div>
                `;
            });
        }

        // リバース設定 (30段階)
        function getReverseCost(index) {
            return 1000 * Math.pow(15, index);
        }

        function doReverse(index) {
            let cost = getReverseCost(index);
            if (game.coins >= cost && game.reverseCount === index) {
                game.coins = 0;
                game.reverseCount++;
                // 強化の初期化
                game.upgrades = { click: 1, auto: 0, multiplier: 1, speed: 1 };
                saveGame();
                renderReverse();
                renderUpgrades();
                renderGacha();
                updateUI();
                showToast("🌌 宇宙再生が実行されました！");
            }
        }

        function renderReverse() {
            const container = document.getElementById("tab-reverse");
            container.innerHTML = "";
            for (let i = 0; i < 30; i++) {
                let cost = getReverseCost(i);
                let isUnlocked = game.reverseCount >= i;
                let isCurrent = game.reverseCount === i;
                let canBuy = game.coins >= cost && isCurrent;

                let stateText = isUnlocked ? (isCurrent ? "実行可能" : "完了") : "ロック中";
                
                container.innerHTML += `
                    <div class="list-item" style="opacity: ${isUnlocked || isCurrent ? 1 : 0.4}">
                        <div class="item-info">
                            <div class="item-title">宇宙再生 段階 ${i + 1}</div>
                            <div class="item-desc">すべての生産基盤をリセットし、生産倍率を爆発的に高めます。</div>
                            <div class="item-lv">${stateText}</div>
                        </div>
                        <button class="action-btn reverse-btn" ${canBuy ? '' : 'disabled'} onclick="doReverse(${i})">
                            実行 (${format(cost)})
                        </button>
                    </div>
                `;
            }
        }

        // ガチャ設定 (30個の卵、確認ポップアップなしで超高速連打可能)
        function getEggCost(level) {
            return 100 * Math.pow(8, level - 1);
        }

        function buyGacha(level) {
            let cost = getEggCost(level);
            if (game.coins >= cost && game.reverseCount >= (level - 1)) {
                game.coins -= cost;
                
                // 対象の卵に属するペットをフィルタリング
                let eggPets = petsData.filter(p => p.eggLevel === level);
                
                // 重み付け抽選
                let totalWeight = 0;
                let rolledPets = [];
                eggPets.forEach(p => {
                    let rData = RARITIES.find(r => r.key === p.rarity);
                    totalWeight += rData.weight;
                    rolledPets.push({ pet: p, cumulativeWeight: totalWeight });
                });

                let roll = Math.random() * totalWeight;
                let selectedPet = rolledPets.find(rp => roll <= rp.cumulativeWeight).pet;

                // 所得処理
                game.unlockedPets[selectedPet.id] = (game.unlockedPets[selectedPet.id] || 0) + 1;
                
                // 高速連打用に確認ダイアログは完全に排除し、トースト通知のみで処理
                showToast(`🐣 ${selectedPet.name} を獲得！`);
                
                saveGame();
                renderGacha();
                renderPets();
                updateUI();
            }
        }

        function renderGacha() {
            const container = document.getElementById("tab-gacha");
            container.innerHTML = "";
            for (let e = 1; e <= 30; e++) {
                let cost = getEggCost(e);
                let isReqMet = game.reverseCount >= (e - 1);
                let canBuy = game.coins >= cost && isReqMet;

                container.innerHTML += `
                    <div class="list-item" style="opacity: ${isReqMet ? 1 : 0.4}">
                        <div class="item-info">
                            <div class="item-title">宇宙卵 Lv.${e}</div>
                            <div class="item-desc">全50種のレア相棒からランダムに1体が誕生します。</div>
                            <div class="item-lv">${isReqMet ? '解放済み' : `必要リバース回数: ${e - 1}回`}</div>
                        </div>
                        <button class="action-btn gacha-btn" ${canBuy ? '' : 'disabled'} onclick="buyGacha(${e})">
                            孵化 (${format(cost)})
                        </button>
                    </div>
                `;
            }
        }

        // 相棒・図鑑画面の描画
        function renderPets() {
            const container = document.getElementById("pet-list-container");
            container.innerHTML = "";
            let dexCount = 0;

            petsData.forEach(pet => {
                let count = game.unlockedPets[pet.id] || 0;
                if(count > 0) dexCount++;

                if(count > 0) {
                    container.innerHTML += `
                        <div class="pet-card">
                            <span class="rarity-badge rarity-${pet.rarity}">${pet.rarityName}</span>
                            <div class="pet-name">${pet.name}</div>
                            <div class="pet-mult">生産倍率: x${format(pet.multiplier)}</div>
                            <div class="pet-count">×${count}</div>
                        </div>
                    `;
                } else {
                    container.innerHTML += `
                        <div class="pet-card locked">
                            <span class="rarity-badge" style="background-color: #374151;">???</span>
                            <div class="pet-name" style="color: #4b5563;">未発見の相棒</div>
                            <div class="pet-mult">卵 Lv.${pet.eggLevel} から排出</div>
                        </div>
                    `;
                }
            });

            document.getElementById("dex-count").innerText = dexCount;
            document.getElementById("dex-percent").innerText = ((dexCount / 1000) * 100).toFixed(1);
            document.getElementById("best-pet-mult").innerText = `x${format(getBestPetMultiplier())}`;
        }

        // トーストメッセージ表示
        function showToast(msg) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 1800);
        }

        // UI全体更新
        function updateUI() {
            document.getElementById("coin-display").innerText = `${format(game.coins)} コイン`;
            document.getElementById("cpc-text").innerText = format(getCPC());
            document.getElementById("cps-text").innerText = format(getCPS());
            document.getElementById("mult-text").innerText = `x${format(getGlobalMultiplier())}`;
            document.getElementById("reverse-text").innerText = game.reverseCount;
            
            let speed = 10 + game.upgrades.speed * 2;
            document.getElementById("autoclick-speed-text").innerText = `速度: 秒間${speed.toFixed(1)}回`;

            // 購入ボタンの活性状態を毎フレームチェック
            document.querySelectorAll("#tab-upgrade .action-btn").forEach((btn, idx) => {
                let spec = upgradeSpecs[idx];
                let cost = getUpgradeCost(spec.key, game.upgrades[spec.key]);
                btn.disabled = game.coins < cost;
            });
            document.querySelectorAll("#tab-reverse .action-btn").forEach((btn, idx) => {
                let cost = getReverseCost(idx);
                btn.disabled = !(game.coins >= cost && game.reverseCount === idx);
            });
            document.querySelectorAll("#tab-gacha .action-btn").forEach((btn, idx) => {
                let cost = getEggCost(idx + 1);
                btn.disabled = !(game.coins >= cost && game.reverseCount >= idx);
            });
        }

        // セーブ＆ロードシステム
        function saveGame() {
            localStorage.setItem("space_clicker_save_v7", JSON.stringify(game));
        }

        function loadGame() {
            let saved = localStorage.getItem("space_clicker_save_v7");
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    if (parsed && typeof parsed === 'object') {
                        game = Object.assign(game, parsed);
                    }
                } catch(e) { console.error("Save load failed", e); }
            }
        }

        // 初期化処理
        window.onload = () => {
            loadGame();
            
            // イベントリスナー
            document.getElementById("click-btn").addEventListener("click", doClick);
            document.getElementById("autoclick-toggle").addEventListener("change", updateButtonPulse);

            // 定期処理の開始
            renderUpgrades();
            renderReverse();
            renderGacha();
            renderPets();
            updateUI();

            // オートクリック＆長押しマクロループ始動
            requestAnimationFrame(updateAutoclickLoop);

            // パッシブCPS自動生産タイマー (100ms周期)
            setInterval(() => {
                if (getCPS() > 0) {
                    addCoins(getCPS() / 10);
                }
            }, 100);

            // 10秒毎の定時オートセーブ
            setInterval(() => {
                saveGame();
                showToast("💾 オートセーブ完了");
            }, 1000);
        };
    </script>
</body>
</html>
