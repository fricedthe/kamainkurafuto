<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宇宙再生クリッカーゲーム v14</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background-color: #0b111e;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Left Panel */
        .left-panel {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            background: radial-gradient(circle at center, #141f36 0%, #0b111e 70%);
        }
        .auto-clicker-box {
            position: absolute;
            top: 24px;
            left: 24px;
            background-color: #111a2e;
            border: 1px solid #1e2d4a;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 10;
        }
        .ac-info {
            display: flex;
            flex-direction: column;
        }
        .ac-title {
            font-size: 12px;
            font-weight: bold;
            color: #8fa0c0;
            letter-spacing: 0.5px;
        }
        .ac-speed {
            font-size: 11px;
            color: #e2b842;
            margin-top: 2px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #243757;
            transition: .2s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #e2b842; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        .admin-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .admin-btn:hover { transform: scale(1.1); }

        /* Stats Area */
        .stats-container {
            text-align: center;
            margin-top: 100px;
        }
        .coin-display {
            font-size: 52px;
            font-weight: bold;
            color: #ebd16a;
            text-shadow: 0 0 20px rgba(235, 209, 106, 0.3);
            font-variant-numeric: tabular-nums;
        }
        .sub-stats {
            margin-top: 12px;
            font-size: 13px;
            color: #a0aec0;
            line-height: 1.6;
        }

        /* Clicker Button Container */
        .clicker-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }
        .main-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffeb60 0%, #d4af12 80%, #aa8c0e 100%);
            border: 6px solid #223254;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 -8px 20px rgba(0,0,0,0.4), inset 0 8px 20px rgba(255,255,255,0.4);
            cursor: pointer;
            position: relative;
            outline: none;
            transition: border-color 0.2s;
        }
        .main-button:hover { border-color: #31497a; }
        
        /* Artwork inside Button */
        .button-art {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .eye-left {
            position: absolute;
            top: 38%; left: 35%;
            width: 12px; height: 12px;
            border: 3px solid #111a2e;
            border-radius: 50%;
        }
        .eye-right {
            position: absolute;
            top: 36%; right: 35%;
            width: 14px; height: 14px;
            position: absolute;
        }
        .eye-right::before, .eye-right::after {
            content: '';
            position: absolute;
            top: 50%; left: 0;
            width: 14px; height: 3px;
            background-color: #111a2e;
        }
        .eye-right::before { transform: rotate(45deg); }
        .eye-right::after { transform: rotate(-45deg); }
        
        .arrows-icon {
            position: absolute;
            top: 42%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 2px;
        }
        .arrow-line {
            width: 3px; height: 32px;
            background-color: #111a2e;
            position: relative;
        }
        .arrow-line::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translate(-50%, -30%) rotate(45deg);
            width: 7px; height: 7px;
            border-top: 3px solid #111a2e;
            border-left: 3px solid #111a2e;
        }

        /* Impulse Stack Particle Combo System */
        .stack-particle-container {
            position: absolute;
            top: 35%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .stack-text {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(0,0,0,0.8), 0 0 8px #ebd16a;
            transform: scale(1);
            transition: transform 0.05s cubic-bezier(0.1, 0.8, 0.3, 1);
            will-change: transform, opacity;
        }
        .combo-gauge-bg {
            width: 80px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .combo-gauge-fill {
            width: 100%;
            height: 100%;
            background: #ebd16a;
            transform-origin: left;
        }

        .input-hint {
            font-size: 12px;
            color: #637599;
            margin-bottom: 24px;
            background: rgba(17, 26, 46, 0.6);
            padding: 6px 12px;
            border-radius: 12px;
        }

        /* Right Panel */
        .right-panel {
            width: 480px;
            border-left: 1px solid #16223f;
            background-color: #0b111e;
            display: flex;
            flex-direction: column;
        }
        .reverse-banner {
            padding: 16px 24px;
            background-color: #111a2e;
            border-bottom: 1px solid #16223f;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rb-left {
            display: flex;
            flex-direction: column;
        }
        .rb-title {
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rb-cond {
            font-size: 11px;
            color: #8fa0c0;
            margin-top: 4px;
        }
        .rb-btn {
            background: linear-gradient(135deg, #1d3557 0%, #111a2e 100%);
            border: 1px solid #243757;
            color: #637599;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: not-allowed;
        }
        .rb-btn.active {
            background: linear-gradient(135deg, #e2b842 0%, #aa8c0e 100%);
            border: none;
            color: #111a2e;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(226, 184, 66, 0.2);
        }

        /* Tabs Menu */
        .tabs-bar {
            display: flex;
            background-color: #0b111e;
            border-bottom: 1px solid #16223f;
        }
        .tab-item {
            flex: 1;
            padding: 14px 0;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: #8fa0c0;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }
        .tab-item:hover { color: #ffffff; }
        .tab-item.active {
            color: #ffffff;
            font-weight: bold;
        }
        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 15%; width: 70%; height: 2px;
            background-color: #ebd16a;
        }

        /* Content List View */
        .menu-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card-item {
            background-color: #111a2e;
            border: 1px solid #16223f;
            border-radius: 8px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }
        .card-item:hover { border-color: #20335e; }
        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            padding-right: 12px;
        }
        .card-name { font-size: 14px; font-weight: bold; color: #ffffff; }
        .card-desc { font-size: 11px; color: #8fa0c0; line-height: 1.4; }
        .card-lv { font-size: 11px; color: #ebd16a; font-weight: bold; }
        
        .buy-btn {
            background: linear-gradient(135deg, #1a5cff 0%, #0039cb 100%);
            border: none;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(26, 92, 255, 0.25);
            transition: opacity 0.1s;
        }
        .buy-btn:active { opacity: 0.8; }
        .buy-btn:disabled {
            background: #192239;
            color: #4a597a;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Hatch Log and Gacha List style */
        .hatch-log-box {
            background-color: #080d18;
            border: 1px dashed #16223f;
            border-radius: 6px;
            padding: 10px;
            font-size: 11px;
            max-height: 100px;
            overflow-y: auto;
            color: #a0aec0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Companion & Encyclopedia Grid */
        .pet-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .pet-box {
            background-color: #111a2e;
            border: 1px solid #16223f;
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .pet-rarity {
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
        }
        
        /* Rarity Theme */
        .rarity-common { background: rgba(160,174,192,0.15); color: #a0aec0; }
        .rarity-rare { background: rgba(72,187,120,0.15); color: #48bb78; }
        .rarity-epic { background: rgba(66,153,225,0.15); color: #4299e1; }
        .rarity-legend { background: rgba(236,101,82,0.15); color: #ec6552; }
        .rarity-mythic { background: rgba(159,122,234,0.15); color: #9f7aea; }
        .rarity-godly { background: rgba(237,137,54,0.15); color: #ed8936; }
        .rarity-secret { background: rgba(214,158,46,0.15); color: #d69e2e; }
        .rarity-eternal { background: linear-gradient(90deg, rgba(229,62,62,0.2), rgba(214,158,46,0.2)); color: #f56565; border: 1px solid #ebd16a; }

        .empty-text {
            grid-column: span 2;
            text-align: center;
            color: #4a597a;
            font-size: 13px;
            padding: 32px 0;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b111e; }
        ::-webkit-scrollbar-thumb { background: #1c2b4d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #283d6b; }
    </style>
</head>
<body>

    <!-- LEFT SIDE: CLICKER SPACE -->
    <div class="left-panel">
        <div class="auto-clicker-box">
            <div class="ac-info">
                <span class="ac-title">AUTO CLICKER</span>
                <span class="ac-speed" id="ac-speed-text">速度: 秒間0回</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="ac-toggle">
                <span class="slider"></span>
            </label>
            <button class="admin-btn" id="admin-trigger" title="管理者コード入力">🔨</button>
        </div>

        <div class="stats-container">
            <div class="coin-display" id="coin-amount">0.00</div>
            <div class="sub-stats">
                <div>秒間自動生産 (CPS): <span id="cps-amount" style="color: #4299e1;">0.00</span></div>
                <div>1クリック: <span id="cpc-amount" style="color: #48bb78;">1.00</span></div>
                <div>永続生産倍率: <span id="mult-amount" style="color: #9f7aea;">x1.00</span></div>
                <div>再生回数: <span id="reborn-amount" style="color: #ed8936;">0</span> 回</div>
            </div>
        </div>

        <div class="clicker-container">
            <div class="stack-particle-container">
                <div class="stack-text" id="stack-display"></div>
                <div class="combo-gauge-bg" id="combo-gauge-bg">
                    <div class="combo-gauge-fill" id="combo-gauge-fill"></div>
                </div>
            </div>
            <button class="main-button" id="click-btn">
                <div class="button-art">
                    <div class="eye-left"></div>
                    <div class="eye-right"></div>
                    <div class="arrows-icon">
                        <div class="arrow-line"></div>
                        <div class="arrow-line"></div>
                        <div class="arrow-line"></div>
                        <div class="arrow-line"></div>
                    </div>
                </div>
            </button>
        </div>

        <div class="input-hint">💻 [スペースキー] 長押しで超高速自動連打！</div>
    </div>

    <!-- RIGHT SIDE: UPGRADES & TABS -->
    <div class="right-panel">
        <div class="reverse-banner">
            <div class="rb-left">
                <span class="rb-title">✨ 次の宇宙再生 (リバース)</span>
                <span class="rb-cond" id="reborn-next-name">宇宙再生段階 1</span>
            </div>
            <button class="rb-btn" id="reborn-action-btn">実行不可</button>
        </div>

        <div class="tabs-bar">
            <div class="tab-item active" onclick="switchTab('upgrade')">無限強化</div>
            <div class="tab-item" onclick="switchTab('gacha')">卵・ガチャ</div>
            <div class="tab-item" onclick="switchTab('companions')">相棒一覧</div>
            <div class="tab-item" onclick="switchTab('collection')" id="collection-tab-title">図鑑 (0%)</div>
        </div>

        <!-- TAB CONTENT CONTAINER -->
        <div class="menu-content" id="tab-content-panel">
            <!-- Dynamically injected -->
        </div>
    </div>

    <script>
        // 大数表記フォーマット用の単位配列 (Novemdecillionまで対応)
        const SUFFIXES = [
            "", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc",
            "Ud", "Dd", "Td", "Qad", "Qid", "Sxd", "Spd", "Ocd", "Nod"
        ];
        // Novemdecillion = 10^60. 配列インデックス20 = 10^(20*3) = 10^60.
        const MAX_LIMIT = 1e63; 

        // ゲーム状態オブジェクト
        let state = {
            coins: 0,
            reborns: 0,
            upgrades: {
                click: 1,      // 1クリック強化
                auto: 0,       // 秒間自動生産
                multiplier: 0, // 生産倍率
                speed: 0       // 連打速度
            },
            ownedPets: [],     // 所持ペット
            discoveredPets: {} // 解放済み図鑑マップ
        };

        // 30段階の洗練されたリバースデータ構成 (コスト上昇率: 120倍ずつの本格ハードバランス)
        const REBORN_STEPS = [];
        let baseCost = 100000; // 段階1: 100.00 K
        for(let i = 1; i <= 30; i++) {
            REBORN_STEPS.push({
                level: i,
                name: `宇宙超越次元 ${i}`,
                cost: baseCost,
                boost: 10 + (i * 5) // 獲得する追加マルチプライヤー
            });
            baseCost *= 120; // 毎回120倍に増加
        }

        // 8つのレアリティと排出基本重み設定
        const RARITIES = {
            common:   { name: "コモン", weight: 75000, multiplier: 1.5 },
            rare:     { name: "レア", weight: 20000, multiplier: 3.0 },
            epic:     { name: "エピック", weight: 4500, multiplier: 6.0 },
            legend:   { name: "レジェンド", weight: 450, multiplier: 15.0 },
            mythic:   { name: "ミシック", weight: 45, multiplier: 50.0 },
            godly:    { name: "ゴッドリー", weight: 4.5, multiplier: 200.0 },
            secret:   { name: "シークレット", weight: 0.45, multiplier: 1000.0 },
            eternal:  { name: "エターナル", weight: 0.045, multiplier: 5000.0 }
        };

        // 30種類の卵と1000体のペット生成
        const EGGS = [];
        let petGlobalId = 1;
        const rarityKeys = Object.keys(RARITIES);

        for (let e = 1; e <= 30; e++) {
            let reqReborn = Math.max(0, e - 1);
            let eggCost = 500 * Math.pow(12, e - 1); // 卵も進行に応じて高額化
            let eggPets = [];

            // 各卵に約33~34体のペットを分配して合計1000体を構築
            let countForEgg = (e === 30) ? 43 : 33; 
            for (let p = 1; p <= countForEgg; p++) {
                // 決定論的なレアリティ分配
                let rKey = "common";
                if (p > 15) rKey = "rare";
                if (p > 24) rKey = "epic";
                if (p > 29) rKey = "legend";
                if (p > 31) rKey = "mythic";
                if (p == 33 && p % 2 === 0) rKey = "godly";
                if (p == 33 && p % 2 !== 0) rKey = "secret";
                if (e === 30 && p > 40) rKey = "eternal";

                eggPets.push({
                    id: petGlobalId,
                    name: `${RARITIES[rKey].name}・相棒生命体 Lv.${petGlobalId}`,
                    rarity: rKey,
                    boost: RARITIES[rKey].multiplier * (1 + (petGlobalId * 0.02))
                });
                petGlobalId++;
            }

            EGGS.push({
                id: e,
                name: `宇宙卵グレード ${e}`,
                cost: eggCost,
                requiredReborns: reqReborn,
                pets: eggPets
            });
        }

        // 各種UI参照
        let activeTab = 'upgrade';
        const coinEl = document.getElementById('coin-amount');
        const cpsEl = document.getElementById('cps-amount');
        const cpcEl = document.getElementById('cpc-amount');
        const multEl = document.getElementById('mult-amount');
        const rebornEl = document.getElementById('reborn-amount');
        const acSpeedEl = document.getElementById('ac-speed-text');
        const acToggle = document.getElementById('ac-toggle');
        const clickBtn = document.getElementById('click-btn');
        const rbNextNameEl = document.getElementById('reborn-next-name');
        const rbActionBtn = document.getElementById('reborn-action-btn');
        const tabContentPanel = document.getElementById('tab-content-panel');
        const collectionTabTitle = document.getElementById('collection-tab-title');
        
        // インパルススタック演出用
        const stackDisplay = document.getElementById('stack-display');
        const comboGaugeBg = document.getElementById('combo-gauge-bg');
        const comboGaugeFill = document.getElementById('combo-gauge-fill');
        let accumulatedClickValue = 0;
        let comboTimeoutId = null;
        let lastComboTime = 0;

        // バッチ処理用バッファ変数
        let pendingClicksCount = 0;

        // 数値フォーマッタ (綺麗に整った3桁区切り大数表記、小数点は.xxのみ)
        function formatBigNumber(num) {
            if (num >= MAX_LIMIT) return "Novemdecillion (MAX)";
            if (num < 1000) return num.toFixed(2);
            let exp = Math.floor(Math.log10(num) / 3);
            if (exp >= SUFFIXES.length) exp = SUFFIXES.length - 1;
            let base = num / Math.pow(10, exp * 3);
            return `${base.toFixed(2)} ${SUFFIXES[exp]}`;
        }

        // 計算ロジック
        function getBestPetMultiplier() {
            if (state.ownedPets.length === 0) return 1;
            // 所持している中で最も高い倍率を誇る相棒を自動適用
            return Math.max(...state.ownedPets.map(p => p.boost));
        }

        function getRebornMultiplier() {
            let m = 1;
            for(let i = 0; i < state.reborns; i++) {
                if(REBORN_STEPS[i]) m *= REBORN_STEPS[i].boost;
            }
            return m;
        }

        function getGlobalMultiplier() {
            let upgradeMult = 1 + (state.upgrades.multiplier * 0.25);
            return upgradeMult * getRebornMultiplier() * getBestPetMultiplier();
        }

        function getClickPower() {
            let base = state.upgrades.click * 1;
            return base * getGlobalMultiplier();
        }

        function getAutoCPS() {
            let base = state.upgrades.auto * 5;
            return base * getGlobalMultiplier();
        }

        // オートクリッカーの速度（連打速度アップグレード依存）
        function getAutoClickerCPS() {
            if (state.upgrades.speed === 0) return 10; // 初期秒間10回
            return 10 + (state.upgrades.speed * 25);   // レベルごとに秒間+25回
        }

        // 状態更新と表示
        function updateDisplay() {
            coinEl.innerText = formatBigNumber(state.coins);
            cpsEl.innerText = formatBigNumber(getAutoCPS()) + " Sp";
            cpcEl.innerText = formatBigNumber(getClickPower()) + " Sp";
            multEl.innerText = `x${formatBigNumber(getGlobalMultiplier())} Qa`;
            rebornEl.innerText = state.reborns;

            // リバース情報の更新
            let nextStep = REBORN_STEPS.find(s => s.level === state.reborns + 1);
            if (nextStep) {
                rbNextNameEl.innerText = `${nextStep.name}`;
                rbActionBtn.innerText = `実行（${formatBigNumber(nextStep.cost)}）`;
                if (state.coins >= nextStep.cost) {
                    rbActionBtn.className = "rb-btn active";
                    rbActionBtn.disabled = false;
                } else {
                    rbActionBtn.className = "rb-btn";
                    rbActionBtn.disabled = true;
                }
            } else {
                rbNextNameEl.innerText = "全次元の覇者";
                rbActionBtn.innerText = "完全終了";
                rbActionBtn.className = "rb-btn";
                rbActionBtn.disabled = true;
            }

            acSpeedEl.innerText = `速度: 秒間${getAutoClickerCPS().toFixed(1)}回`;

            // 図鑑達成率
            let discoveredCount = Object.keys(state.discoveredPets).length;
            let percent = ((discoveredCount / 1000) * 100).toFixed(1);
            collectionTabTitle.innerText = `図鑑 (${percent}%)`;
        }

        // 究極かっこいいインパルススタックコンボ演出
        function triggerImpulseStack(value) {
            accumulatedClickValue += value;
            lastComboTime = Date.now();
            
            stackDisplay.innerText = `+${formatBigNumber(accumulatedClickValue)}`;
            stackDisplay.style.transform = "scale(1.35)";
            setTimeout(() => {
                stackDisplay.style.transform = "scale(1)";
            }, 30);

            comboGaugeBg.style.opacity = "1";
            comboGaugeFill.style.transform = "scaleX(1)";

            if (comboTimeoutId) clearTimeout(comboTimeoutId);
            
            // ゲージ減少アニメーションと終了処理
            let duration = 800; 
            let start = Date.now();
            
            function shrinkGauge() {
                let now = Date.now();
                let elapsed = now - lastComboTime;
                let remaining = 1 - (elapsed / duration);
                if (remaining <= 0) {
                    comboGaugeFill.style.transform = "scaleX(0)";
                    stackDisplay.innerText = "";
                    comboGaugeBg.style.opacity = "0";
                    accumulatedClickValue = 0;
                } else {
                    comboGaugeFill.style.transform = `scaleX(${remaining})`;
                    comboTimeoutId = setTimeout(shrinkGauge, 30);
                }
            }
            comboTimeoutId = setTimeout(shrinkGauge, 30);
        }

        // アニメーションエフェクト
        function animateButtonPulse(deep = false) {
            clickBtn.style.transform = deep ? "scale(0.91)" : "scale(0.96)";
            setTimeout(() => {
                clickBtn.style.transform = "scale(1)";
            }, 40);
        }

        // コイン追加の一括バッチ実行処理
        function applyClicksBatch() {
            if (pendingClicksCount <= 0) return;
            let singlePower = getClickPower();
            let totalAdded = singlePower * pendingClicksCount;
            
            state.coins += totalAdded;
            if (state.coins > MAX_LIMIT) state.coins = MAX_LIMIT;

            triggerImpulseStack(totalAdded);
            pendingClicksCount = 0;
            updateDisplay();
            if (activeTab === 'upgrade' || activeTab === 'gacha') renderTabContent();
        }

        // 手動クリック
        clickBtn.addEventListener('click', () => {
            pendingClicksCount++;
            animateButtonPulse(true);
            applyClicksBatch();
        });

        // 宇宙再生実行
        rbActionBtn.addEventListener('click', () => {
            let nextStep = REBORN_STEPS.find(s => s.level === state.reborns + 1);
            if (nextStep && state.coins >= nextStep.cost) {
                state.coins = 0;
                state.reborns++;
                state.upgrades.click = 1;
                state.upgrades.auto = 0;
                state.upgrades.multiplier = 0;
                state.upgrades.speed = 0;
                
                updateDisplay();
                renderTabContent();
                saveGame();
            }
        });

        // タブ切り替えシステム
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            renderTabContent();
        }

        // タブ内UIレンダリング
        function renderTabContent() {
            tabContentPanel.innerHTML = "";

            if (activeTab === 'upgrade') {
                // 無限強化カードの表示
                const upData = [
                    { key: 'click', name: '1クリック強化', desc: '1クリックのパワーを直接増加させます', base: 10, scale: 1.4, format: (lv) => `Lv.${lv}` },
                    { key: 'auto', name: '秒間自動生産', desc: 'クリックしなくても自動でコインを生産します', base: 50, scale: 1.5, format: (lv) => `Lv.${lv}` },
                    { key: 'multiplier', name: '生産倍率', desc: '全体の生産効率をパーセンテージで乗算します', base: 250, scale: 1.6, format: (lv) => `Lv.${lv}` },
                    { key: 'speed', name: '連打速度', desc: 'オートクリッカーマクロの秒間稼働速度を強化します', base: 100, scale: 1.8, format: (lv) => `Lv.${lv}` }
                ];

                upData.forEach(item => {
                    let currentLv = state.upgrades[item.key];
                    let cost = item.base * Math.pow(item.scale, currentLv);
                    
                    let card = document.createElement('div');
                    card.className = 'card-item';
                    card.innerHTML = `
                        <div class="card-info">
                            <span class="card-name">${item.name}</span>
                            <span class="card-desc">${item.desc}</span>
                            <span class="card-lv">${item.format(currentLv)}</span>
                        </div>
                        <button class="buy-btn" ${state.coins < cost ? 'disabled' : ''} onclick="buyUpgrade('${item.key}', ${cost})">
                            ${formatBigNumber(cost)} コイン
                        </button>
                    `;
                    tabContentPanel.appendChild(card);
                });
            } 
            else if (activeTab === 'gacha') {
                // ガチャ・卵メニュー
                let heading = document.createElement('div');
                heading.className = 'card-name';
                heading.style.marginBottom = '6px';
                heading.innerText = "🥚 宇宙卵ガチャ (孵化すると直接自動追加)";
                tabContentPanel.appendChild(heading);

                let logBox = document.createElement('div');
                logBox.className = 'hatch-log-box';
                logBox.id = 'hatch-logs';
                logBox.innerHTML = '<div>🐣 ガチャ履歴がここにリアルタイム表示されます...</div>';
                tabContentPanel.appendChild(logBox);

                EGGS.forEach(egg => {
                    let isLocked = state.reborns < egg.requiredReborns;
                    let card = document.createElement('div');
                    card.className = 'card-item';
                    
                    if (isLocked) {
                        card.innerHTML = `
                            <div class="card-info">
                                <span class="card-name" style="color: #4a597a;">🔒 未解放の宇宙卵 (要再生 ${egg.requiredReborns}回)</span>
                                <span class="card-desc">高次元へ到達することでこの卵の封印を解くことができます。</span>
                            </div>
                            <button class="buy-btn" disabled>ロック中</button>
                        `;
                    } else {
                        card.innerHTML = `
                            <div class="card-info">
                                <span class="card-name">${egg.name}</span>
                                <span class="card-desc">内蔵相棒数: ${egg.pets.length}体 (最高確率: エターナル等超激レア化)</span>
                            </div>
                            <button class="buy-btn" ${state.coins < egg.cost ? 'disabled' : ''} onclick="drawGacha(${egg.id}, ${egg.cost})">
                                孵化 (${formatBigNumber(egg.cost)})
                            </button>
                        `;
                    }
                    tabContentPanel.appendChild(card);
                });
            }
            else if (activeTab === 'companions') {
                // 相棒一覧（所持ペット）
                if (state.ownedPets.length === 0) {
                    tabContentPanel.innerHTML = `<div class="empty-text">現在、まだ一緒に戦う相棒ペットがいません。<br>「卵・ガチャ」タブから孵化させてみましょう！</div>`;
                    return;
                }
                
                let container = document.createElement('div');
                container.className = 'pet-grid';
                
                // 倍率の高い順にソートして綺麗に整列
                let sorted = [...state.ownedPets].sort((a,b) => b.boost - a.boost);
                sorted.forEach(pet => {
                    let box = document.createElement('div');
                    box.className = 'pet-box';
                    box.innerHTML = `
                        <span class="pet-rarity rarity-${pet.rarity}">${RARITIES[pet.rarity].name}</span>
                        <div class="card-name" style="font-size:12px;">${pet.name}</div>
                        <div class="card-lv" style="font-size:11px; color:#48bb78;">生産力倍率: x${pet.boost.toFixed(2)}</div>
                    `;
                    container.appendChild(box);
                });
                tabContentPanel.appendChild(container);
            }
            else if (activeTab === 'collection') {
                // 図鑑
                let container = document.createElement('div');
                container.className = 'pet-grid';
                
                let allPetsFlattened = [];
                EGGS.forEach(e => allPetsFlattened.push(...e.pets));

                allPetsFlattened.forEach(pet => {
                    let isDiscovered = !!state.discoveredPets[pet.id];
                    let box = document.createElement('div');
                    box.className = 'pet-box';
                    if (isDiscovered) {
                        box.innerHTML = `
                            <span class="pet-rarity rarity-${pet.rarity}">${RARITIES[pet.rarity].name}</span>
                            <div class="card-name" style="font-size:12px;">${pet.name}</div>
                            <div class="card-lv" style="font-size:11px; color:#48bb78;">倍率: x${pet.boost.toFixed(2)}</div>
                        `;
                    } else {
                        box.style.opacity = "0.35";
                        box.innerHTML = `
                            <span class="pet-rarity" style="background:#223254; color:#637599;">???</span>
                            <div class="card-name" style="font-size:12px; color:#4a597a;">未発見の相棒</div>
                            <div class="card-lv" style="font-size:11px; color:#4a597a;">ガチャから入手で解放</div>
                        `;
                    }
                    container.appendChild(box);
                });
                tabContentPanel.appendChild(container);
            }
        }

        // アップグレード購入
        function buyUpgrade(key, cost) {
            if (state.coins >= cost) {
                state.coins -= cost;
                state.upgrades[key]++;
                updateDisplay();
                renderTabContent();
                saveGame();
            }
        }

        // ガチャを引く（確認なしの瞬時自動追加＆激渋確率テーブル仕様）
        function drawGacha(eggId, cost) {
            if (state.coins < cost) return;
            state.coins -= cost;

            let egg = EGGS.find(e => e.id === eggId);
            if (!egg) return;

            // 超厳格なリアル確率ロールロジック
            let rand = Math.random() * 100000;
            let selectedRarity = "common";
            let accumulatedWeight = 0;

            for (let r of rarityKeys) {
                accumulatedWeight += RARITIES[r].weight;
                if (rand <= accumulatedWeight) {
                    selectedRarity = r;
                    break;
                }
            }

            // 選ばれたレアリティに一致する卵内ペットをフィルタ
            let pool = egg.pets.filter(p => p.rarity === selectedRarity);
            // 万が一プールが空の場合は卵の中全般からランダム
            if (pool.length === 0) pool = egg.pets;

            let rolledPet = pool[Math.floor(Math.random() * pool.length)];

            // インベントリと図鑑への即座の自動インジェクション
            state.ownedPets.push(rolledPet);
            state.discoveredPets[rolledPet.id] = true;

            // ログの追加更新
            let logBox = document.getElementById('hatch-logs');
            if (logBox) {
                let entry = document.createElement('div');
                let timeStr = new Date().toLocaleTimeString();
                entry.innerHTML = `[${timeStr}] 🐣 <span class="pet-rarity rarity-${rolledPet.rarity}">${RARITIES[rolledPet.rarity].name}</span> <strong>${rolledPet.name}</strong> が誕生し、インベントリに自動追加されました！`;
                logBox.insertBefore(entry, logBox.firstChild);
                if (logBox.children.length > 30) logBox.removeChild(logBox.lastChild);
            }

            updateDisplay();
            renderTabContent();
            saveGame();
        }

        // 🔨 管理者秘密コマンドコードシステム
        document.getElementById('admin-trigger').addEventListener('click', () => {
            let code = prompt("コードを入力してください:");
            if (code === "abekentadesu") {
                localStorage.removeItem("space_clicker_save_v14");
                state = {
                    coins: 0,
                    reborns: 0,
                    upgrades: { click: 1, auto: 0, multiplier: 0, speed: 0 },
                    ownedPets: [],
                    discoveredPets: {}
                };
                alert("全てのセーブデータが完全に削除され、初期化されました。");
                updateDisplay();
                renderTabContent();
            } else if (code !== null) {
                alert("認証コードが正しくありません。");
            }
        });

        // 10秒ごとのサイレントオートセーブ (UIポップアップを完全に廃止した裏稼働システム)
        function saveGame() {
            localStorage.setItem("space_clicker_save_v14", JSON.stringify(state));
        }

        function loadGame() {
            let saved = localStorage.getItem("space_clicker_save_v14");
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    if (parsed.upgrades) {
                        state = Object.assign(state, parsed);
                        // 後方互換対応
                        if(!state.discoveredPets) state.discoveredPets = {};
                    }
                } catch(e) {
                    console.error("セーブデータの読み込みに失敗しました", e);
                }
            }
            updateDisplay();
            renderTabContent();
        }

        // スペースキー長押しの超・高速無限連打検知マクロ
        let spaceIntervalId = null;
        window.addEventListener('keydown', (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                if (!spaceIntervalId) {
                    // バッチ処理を利用して物理限界まで加速
                    spaceIntervalId = setInterval(() => {
                        let innerLoops = Math.max(1, Math.floor(getAutoClickerCPS() / 50));
                        pendingClicksCount += innerLoops;
                        animateButtonPulse(false);
                        applyClicksBatch();
                    }, 16); // 1フレームに何度もクリックを詰め込む
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === "Space") {
                if (spaceIntervalId) {
                    clearInterval(spaceIntervalId);
                    spaceIntervalId = null;
                }
            }
        });

        // オートクリッカー・タイマー機構 (バッチ処理最適化による完全フリーズ回避モデル)
        setInterval(() => {
            if (acToggle.checked) {
                // 連打速度レベルに応じた適切なループ割り振りをミリ秒単位でバッチ処理
                let cpsTarget = getAutoClickerCPS();
                let batchAmount = Math.max(1, Math.floor(cpsTarget / 60));
                pendingClicksCount += batchAmount;
                animateButtonPulse(false);
            }
            
            // 定期的なバッチ解放
            applyClicksBatch();
        }, 16); // 毎秒60回(16ms周期)の最速バッチ同期

        // 毎秒自動生産 (CPS) タイマー
        setInterval(() => {
            let autoProduction = getAutoCPS() / 10;
            if (autoProduction > 0) {
                state.coins += autoProduction;
                if (state.coins > MAX_LIMIT) state.coins = MAX_LIMIT;
                updateDisplay();
                if (activeTab === 'upgrade' || activeTab === 'gacha') renderTabContent();
            }
        }, 100);

        // 10秒周期の定期サイレントオートセーブ
        setInterval(saveGame, 10000);

        // 初期起動
        window.onload = () => {
            loadGame();
        };
    </script>
</body>
</html>
