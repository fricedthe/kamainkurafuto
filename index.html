<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Clicker Extreme v11</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }
        body {
            background-color: #0b111e;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            background: radial-gradient(circle at 30% 30%, #16223f 0%, #0b111e 70%);
        }
        #right-panel {
            width: 480px;
            background-color: #0d1626;
            border-left: 1px solid #1f2d4d;
            display: flex;
            flex-direction: column;
        }
        #autoclicker-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #111a2e;
            border: 1px solid #1f2d4d;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 200px;
        }
        .ac-label {
            font-size: 11px;
            font-weight: bold;
            color: #8fa0c0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ac-status {
            font-size: 12px;
            color: #ffcc00;
            margin-top: 2px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #22314d;
            transition: .2s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #8fa0c0;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #ffcc00; }
        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #0b111e;
        }
        #stats-container {
            text-align: center;
            margin-bottom: 30px;
        }
        #coin-display {
            font-size: 48px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            margin-bottom: 5px;
        }
        .stat-text {
            font-size: 13px;
            color: #8fa0c0;
            margin-bottom: 3px;
        }
        #click-target {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffdd33, #cca300);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 -8px 20px rgba(0,0,0,0.4), inset 0 8px 20px rgba(255,255,255,0.4);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease;
            border: 2px solid #b38f00;
        }
        #click-target:active {
            transform: scale(0.92);
        }
        .face-art {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .face-svg {
            width: 140px;
            height: 140px;
        }
        #space-tip {
            position: absolute;
            bottom: 30px;
            background-color: rgba(17, 26, 46, 0.8);
            border: 1px solid #1f2d4d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #8fa0c0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #space-tip span {
            background-color: #22314d;
            padding: 2px 6px;
            border-radius: 4px;
            color: #ffffff;
            font-weight: bold;
        }
        #tab-header {
            display: flex;
            border-bottom: 1px solid #1f2d4d;
            background-color: #111a2e;
        }
        .tab-btn {
            flex: 1;
            padding: 15px 5px;
            background: none;
            border: none;
            color: #8fa0c0;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            text-align: center;
        }
        .tab-btn.active {
            color: #ffcc00;
        }
        .tab-btn.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 15%;
            width: 70%;
            height: 3px;
            background-color: #ffcc00;
            border-radius: 3px 3px 0 0;
        }
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .menu-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upgrade-card {
            background-color: #111a2e;
            border: 1px solid #1f2d4d;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upgrade-info {
            flex: 1;
            padding-right: 12px;
        }
        .up-name {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .up-desc {
            font-size: 11px;
            color: #8fa0c0;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .up-lvl {
            font-size: 11px;
            font-weight: bold;
            color: #ffcc00;
        }
        .buy-btn {
            background: linear-gradient(135deg, #0055ff, #0033aa);
            border: 1px solid #0066ff;
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            min-width: 110px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 68, 255, 0.2);
            transition: opacity 0.1s;
        }
        .buy-btn:hover:not(:disabled) {
            opacity: 0.9;
        }
        .buy-btn:disabled {
            background: #1a2438;
            border-color: #25334f;
            color: #56698f;
            cursor: not-allowed;
            box-shadow: none;
        }
        .egg-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .egg-card {
            background-color: #111a2e;
            border: 1px solid #1f2d4d;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .egg-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }
        .egg-req {
            font-size: 11px;
            color: #ff5555;
            margin-top: 4px;
        }
        .egg-unlocked .egg-req {
            color: #55ff55;
        }
        #log-box {
            background-color: #080d1a;
            border: 1px solid #1f2d4d;
            border-radius: 6px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-size: 11px;
            color: #8fa0c0;
            margin-top: 15px;
        }
        .log-row {
            margin-bottom: 4px;
            border-bottom: 1px solid #111a2e;
            padding-bottom: 2px;
        }
        .pet-item {
            background-color: #111a2e;
            border: 1px solid #1f2d4d;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pet-name { font-weight: bold; font-size: 13px; }
        .pet-rarity { font-size: 11px; font-weight: bold; margin-top: 2px; }
        .rarity-common { color: #b0b0b0; }
        .rarity-rare { color: #33ccff; }
        .rarity-epic { color: #cc33ff; }
        .rarity-legend { color: #ff9900; }
        .rarity-mythic { color: #ff3366; }
        .rarity-godly { color: #ffff33; }
        .rarity-secret { color: #00ffcc; }
        .rarity-eternal { color: #ff33ff; font-shadow: 0 0 5px rgba(255,51,255,0.5); }
        
        .pet-mult { font-size: 12px; color: #ffcc00; font-weight: bold; }
        .active-badge {
            background-color: #0088ff;
            color: #fff;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: bold;
        }
        .dex-stats {
            background-color: #111a2e;
            border: 1px solid #1f2d4d;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 15px;
            text-align: center;
        }
        .dex-bar-container {
            background-color: #080d1a;
            border-radius: 10px;
            height: 16px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid #1f2d4d;
        }
        .dex-bar-fill {
            background: linear-gradient(90deg, #ffcc00, #ff6600);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .dex-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .dex-box {
            background-color: #111a2e;
            border: 1px solid #1f2d4d;
            border-radius: 6px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #56698f;
        }
        .dex-box.discovered {
            color: #ffffff;
            border-color: #ffcc00;
            background: radial-gradient(circle, #1a2a4a 0%, #111a2e 100%);
        }
        .stack-particle {
            position: absolute;
            pointer-events: none;
            color: #ffcc00;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 8px rgba(255,204,0,0.6);
            transform: translate(-50%, -50%);
            animation: stackPulse 0.4s ease-out forwards;
            z-index: 100;
        }
        @keyframes stackPulse {
            0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
            20% { transform: translate(-50%, -70%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -100%) scale(1.0); opacity: 0; }
        }
        @keyframes pulseFast {
            0% { transform: scale(1); }
            50% { transform: scale(0.96); }
            100% { transform: scale(1); }
        }
        .pulsing {
            animation: pulseFast 0.04s infinite ease-in-out;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1626; }
        ::-webkit-scrollbar-thumb { background: #1f2d4d; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="left-panel">
        <div id="autoclicker-box">
            <div>
                <div class="ac-label">Auto Clicker</div>
                <div id="ac-rate-text" class="ac-status">速度: 秒間0.0回</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="ac-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <div id="stats-container">
            <div id="coin-display">0.00</div>
            <div id="cps-display" class="stat-text">秒間自動生産 (CPS): 0.00</div>
            <div id="cpc-display" class="stat-text">1クリック: 1.00</div>
            <div id="mult-display" class="stat-text">永続生産倍率: x1.00</div>
            <div id="rebirth-display" class="stat-text">再生回数: 0回</div>
        </div>

        <div id="click-target">
            <div class="face-art">
                <svg class="face-svg" viewBox="0 0 100 100">
                    <circle cx="35" cy="40" r="4" fill="#0b111e"/>
                    <path d="M 57 34 L 67 44 M 67 34 L 57 44" stroke="#0b111e" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 30 70 Q 50 85 70 70" fill="none" stroke="#0b111e" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 45 15 L 45 30 M 52 13 L 52 28 M 59 15 L 59 30" fill="none" stroke="#0b111e" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <div id="particle-anchor" style="position: absolute; top: 50%; left: 50%;"></div>
        </div>

        <div id="space-tip">
            <span>スペースキー</span> 長押しで超高速自動連打！
        </div>
    </div>

    <div id="right-panel">
        <div id="tab-header">
            <button class="tab-btn active" onclick="switchTab('tab-upgrade')">無限強化</button>
            <button class="tab-btn" onclick="switchTab('tab-egg')">卵・ガチャ</button>
            <button class="tab-btn" onclick="switchTab('tab-pet')">相棒一覧</button>
            <button class="tab-btn" onclick="switchTab('tab-dex')">図鑑</button>
        </div>

        <div id="tab-upgrade" class="tab-content active">
            <div class="menu-title">無限ショップ強化</div>
            <div id="upgrade-list"></div>
        </div>

        <div id="tab-egg" class="tab-content">
            <div class="menu-title">宇宙再生メニュー (リバース)</div>
            <div id="rebirth-zone" style="margin-bottom: 20px;"></div>
            
            <div class="menu-title">宇宙卵孵化ガチャ</div>
            <div id="egg-list" class="egg-grid"></div>
            <div id="log-box">
                <div style="color: #ffcc00; font-weight: bold; margin-bottom: 4px;">🐣 孵化ログ (自動インベントリ格納済)</div>
                <div id="log-content"></div>
            </div>
        </div>

        <div id="tab-pet" class="tab-content">
            <div class="menu-title">所有している相棒</div>
            <div id="pet-list"></div>
        </div>

        <div id="tab-dex" class="tab-content">
            <div class="menu-title" id="dex-title">宇宙相棒図鑑 (0/1000)</div>
            <div class="dex-stats">
                <div id="dex-pct-text" style="font-size: 13px; font-weight: bold;">達成率: 0.00%</div>
                <div class="dex-bar-container">
                    <div id="dex-bar" class="dex-bar-fill"></div>
                </div>
            </div>
            <div id="dex-grid" class="dex-grid"></div>
        </div>
    </div>

    <script>
        const PREFIXES = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "Ud", "Dd", "Td", "Qat", "Qit", "Sxt", "Spt", "Oct", "Nov"];
        const MAX_COINS = 1e60; 

        let state = {
            coins: 0,
            rebirths: 0,
            upgrades: { click: 0, auto: 0, mult: 0, speed: 0 },
            ownedPets: {}, 
            discoveredDex: [] 
        };

        const REBIRTH_DATA = Array.from({ length: 30 }, (_, i) => {
            const id = i + 1;
            return {
                id: id,
                name: `宇宙超越次元 ${id}`,
                cost: 100 * Math.pow(10, i * 2), 
                multiplier: Math.pow(5, id)
            };
        });

        const RARITIES = [
            { name: "コモン", key: "common", weight: 50 },
            { name: "レア", key: "rare", weight: 25 },
            { name: "エピック", key: "epic", weight: 13 },
            { name: "レジェンド", key: "legend", weight: 7 },
            { name: "ミシック", key: "mythic", weight: 3.5 },
            { name: "ゴッドリー", key: "godly", weight: 1.1 },
            { name: "シークレット", key: "secret", weight: 0.35 },
            { name: "エターナル", key: "eternal", weight: 0.05 }
        ];

        let petsMaster = [];
        let eggsMaster = [];

        function initMasterData() {
            let petIdCounter = 1;
            for (let e = 1; e <= 30; e++) {
                let eggPets = [];
                RARITIES.forEach((rarity, rIndex) => {
                    let countInRarity = (e % 2 === 0 && rIndex > 4) ? 2 : 1; 
                    if (rIndex === 7) countInRarity = 1; 
                    for (let p = 0; p < countInRarity; p++) {
                        let id = petIdCounter++;
                        let petMult = Math.pow(2.2, e) * Math.pow(3, rIndex + 1) * (1 + id * 0.005);
                        let name = `${rarity.name}・コスモ機 ${id}`;
                        if (rIndex === 7) name = `エターナル・極光幻獣 ${id}`;
                        else if (rIndex === 6) name = `シークレット・次元龍 ${id}`;
                        else if (rIndex === 5) name = `ゴッドリー・神星神 ${id}`;

                        let petObj = {
                            id: id,
                            name: name,
                            rarity: rarity.key,
                            rarityName: rarity.name,
                            weight: rarity.weight,
                            multiplier: petMult,
                            eggId: e
                        };
                        petsMaster.push(petObj);
                        eggPets.push(petObj);
                    }
                });
                eggsMaster.push({
                    id: e,
                    name: `宇宙卵 Lv.${e}`,
                    cost: 50 * Math.pow(7, e - 1),
                    reqRebirths: e - 1,
                    pets: eggPets
                });
            }
            while(petsMaster.length < 1000) {
                let id = petIdCounter++;
                let e = Math.floor(Math.random() * 30) + 1;
                let rIndex = Math.floor(Math.random() * 4); 
                if (Math.random() < 0.1) rIndex = Math.floor(Math.random() * RARITIES.length);
                let rarity = RARITIES[rIndex];
                let petMult = Math.pow(2.2, e) * Math.pow(3, rIndex + 1) * (1 + id * 0.002);
                let petObj = {
                    id: id,
                    name: `${rarity.name}・増殖種 ${id}`,
                    rarity: rarity.key,
                    rarityName: rarity.name,
                    weight: rarity.weight,
                    multiplier: petMult,
                    eggId: e
                };
                petsMaster.push(petObj);
                eggsMaster[e - 1].pets.push(petObj);
            }
        }

        function format(num) {
            if (num >= MAX_COINS) return "Novemdecillion+";
            if (num < 1000) return num.toFixed(2);
            let exp = Math.floor(Math.log10(num) / 3);
            if (exp >= PREFIXES.length) exp = PREFIXES.length - 1;
            let base = num / Math.pow(10, exp * 3);
            return `${base.toFixed(2)} ${PREFIXES[exp]}`;
        }

        function getRebirthMultiplier() {
            let mult = 1;
            for (let i = 0; i < state.rebirths; i++) {
                if (REBIRTH_DATA[i]) mult *= REBIRTH_DATA[i].multiplier;
            }
            return mult;
        }

        function getBestPetMultiplier() {
            let best = 1;
            for (let id in state.ownedPets) {
                if (state.ownedPets[id] > 0) {
                    let p = petsMaster.find(x => x.id == id);
                    if (p && p.multiplier > best) best = p.multiplier;
                }
            }
            return best;
        }

        function getTotalMultiplier() {
            let shopMult = 1 + state.upgrades.mult * 0.25;
            return getRebirthMultiplier() * getBestPetMultiplier() * shopMult;
        }

        function getCPC() {
            return (1 + state.upgrades.click * 1.5) * getTotalMultiplier();
        }

        function getCPS() {
            return (state.upgrades.auto * 2.0) * getTotalMultiplier();
        }

        function addCoins(amount) {
            state.coins = Math.min(MAX_COINS, state.coins + amount);
            updateUI();
        }

        let accumulatedParticleValue = 0;
        let particleTimer = null;
        let lastParticleTime = 0;

        function triggerClickEffect() {
            let now = Date.now();
            let cpc = getCPC();
            addCoins(cpc);

            accumulatedParticleValue += cpc;

            if (now - lastParticleTime > 40 || !particleTimer) {
                renderStackParticle(accumulatedParticleValue);
                accumulatedParticleValue = 0;
                lastParticleTime = now;
            } else {
                if (particleTimer) clearTimeout(particleTimer);
                particleTimer = setTimeout(() => {
                    renderStackParticle(accumulatedParticleValue);
                    accumulatedParticleValue = 0;
                    lastParticleTime = Date.now();
                }, 40);
            }
        }

        function renderStackParticle(val) {
            if (val <= 0) return;
            let anchor = document.getElementById("particle-anchor");
            let el = document.createElement("div");
            el.className = "stack-particle";
            el.innerText = `+${format(val)}`;
            anchor.appendChild(el);
            setTimeout(() => el.remove(), 400);
        }

        function buyUpgrade(type) {
            let cost = getUpgradeCost(type);
            if (state.coins >= cost) {
                state.coins -= cost;
                state.upgrades[type]++;
                saveGame();
                updateUI();
            }
        }

        function getUpgradeCost(type) {
            let lvl = state.upgrades[type];
            if (type === 'click') return 10 * Math.pow(1.4, lvl);
            if (type === 'auto') return 50 * Math.pow(1.5, lvl);
            if (type === 'mult') return 200 * Math.pow(1.6, lvl);
            if (type === 'speed') return 500 * Math.pow(1.8, lvl);
            return 0;
        }

        function executeRebirth(id) {
            let rData = REBIRTH_DATA.find(x => x.id === id);
            if (!rData) return;
            if (state.coins >= rData.cost && state.rebirths === id - 1) {
                state.coins = 0;
                state.rebirths = id;
                state.upgrades.click = 0;
                state.upgrades.auto = 0;
                state.upgrades.mult = 0;
                saveGame();
                updateUI();
            }
        }

        function buyEgg(eggId) {
            let egg = eggsMaster.find(x => x.id === eggId);
            if (!egg || state.coins < egg.cost || state.rebirths < egg.reqRebirths) return;

            state.coins -= egg.cost;

            let totalWeight = egg.pets.reduce((sum, p) => sum + p.weight, 0);
            let rnd = Math.random() * totalWeight;
            let currentSum = 0;
            let selectedPet = egg.pets[0];

            for (let p of egg.pets) {
                currentSum += p.weight;
                if (rnd <= currentSum) {
                    selectedPet = p;
                    break;
                }
            }

            state.ownedPets[selectedPet.id] = (state.ownedPets[selectedPet.id] || 0) + 1;
            if (!state.discoveredDex.includes(selectedPet.id)) {
                state.discoveredDex.push(selectedPet.id);
            }

            let logBox = document.getElementById("log-content");
            let row = document.createElement("div");
            row.className = "log-row";
            row.innerHTML = `<span class="rarity-${selectedPet.rarity}">[${selectedPet.rarityName}]</span> <strong>${selectedPet.name}</strong> (x${selectedPet.multiplier.toFixed(1)}倍) `;
            logBox.insertBefore(row, logBox.firstChild);
            if (logBox.children.length > 30) logBox.lastChild.remove();

            saveGame();
            updateUI();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function getUpgradeNameJapanese(type) {
            if (type === 'click') return "1クリック強化";
            if (type === 'auto') return "秒間自動生産";
            if (type === 'mult') return "生産倍率";
            if (type === 'speed') return "連打速度";
            return type;
        }

        function getUpgradeDescJapanese(type) {
            if (type === 'click') return "1クリックのパワーを直接増加させます";
            if (type === 'auto') return "クリックしなくても自動でコインを生産します";
            if (type === 'mult') return "全体の生産効率をパーセンテージで乗算します";
            if (type === 'speed') return "オートクリッカーマクロの秒間稼働速度を強化します";
            return "";
        }

        let isSpacePressed = false;
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                isSpacePressed = true;
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                isSpacePressed = false;
            }
        });

        let lastAutoTick = Date.now();
        let mainClockCounter = 0;

        function runGameLoops() {
            let now = Date.now();
            let delta = (now - lastAutoTick) / 1000;
            lastAutoTick = now;

            if (getCPS() > 0) {
                addCoins(getCPS() * delta);
            }

            let speedLvl = state.upgrades.speed;
            let clicksPerFrame = 1;
            let frameInterval = 1;

            if (speedLvl > 0) {
                clicksPerFrame = 1 + Math.floor(speedLvl / 3);
                frameInterval = Math.max(1, 10 - Math.floor(speedLvl / 2));
            }

            mainClockCounter++;

            let isAcOn = document.getElementById("ac-toggle").checked;
            let shouldTriggerMacro = isAcOn || isSpacePressed;

            if (shouldTriggerMacro && (mainClockCounter % frameInterval === 0)) {
                for (let k = 0; k < clicksPerFrame; k++) {
                    triggerClickEffect();
                }
                document.getElementById("click-target").classList.add("pulsing");
            } else if (!isAcOn && !isSpacePressed) {
                document.getElementById("click-target").classList.remove("pulsing");
            }

            let acRateDisplay = 0;
            if (speedLvl === 0) acRateDisplay = 10;
            else {
                let cpsTrue = (60 / frameInterval) * clicksPerFrame;
                acRateDisplay = cpsTrue;
            }
            document.getElementById("ac-rate-text").innerText = `速度: 秒間${acRateDisplay.toFixed(1)}回`;

            requestAnimationFrame(runGameLoops);
        }

        function updateUI() {
            document.getElementById("coin-display").innerText = format(state.coins);
            document.getElementById("cps-display").innerText = `秒間自動生産 (CPS): ${format(getCPS())}`;
            document.getElementById("cpc-display").innerText = `1クリック: ${format(getCPC())}`;
            document.getElementById("mult-display").innerText = `永続生産倍率: x${format(getTotalMultiplier())}`;
            document.getElementById("rebirth-display").innerText = `再生回数: ${state.rebirths}回`;

            let upList = document.getElementById("upgrade-list");
            upList.innerHTML = "";
            ['click', 'auto', 'mult', 'speed'].forEach(type => {
                let cost = getUpgradeCost(type);
                let lvl = state.upgrades[type];
                let card = document.createElement("div");
                card.className = "upgrade-card";
                card.innerHTML = `
                    <div class="upgrade-info">
                        <div class="up-name">${getUpgradeNameJapanese(type)}</div>
                        <div class="up-desc">${getUpgradeDescJapanese(type)}</div>
                        <div class="up-lvl">Lv.${lvl}</div>
                    </div>
                    <button class="buy-btn" ${state.coins < cost ? 'disabled' : ''} onclick="buyUpgrade('${type}')">${format(cost)} コイン</button>
                `;
                upList.appendChild(card);
            });

            let rbZone = document.getElementById("rebirth-zone");
            rbZone.innerHTML = "";
            let nextRb = REBIRTH_DATA.find(x => x.id === state.rebirths + 1);
            if (nextRb) {
                let card = document.createElement("div");
                card.className = "upgrade-card";
                card.style.borderColor = "#ffcc00";
                card.innerHTML = `
                    <div class="upgrade-info">
                        <div class="up-name">${nextRb.name} (進行可能)</div>
                        <div class="up-desc">全強化リセットと引き換えに生産力を【x${nextRb.multiplier}倍】にします</div>
                    </div>
                    <button class="buy-btn" style="background: linear-gradient(135deg, #ff9900, #cc6600); border-color: #ffaa00;" ${state.coins < nextRb.cost ? 'disabled' : ''} onclick="executeRebirth(${nextRb.id})">実行 (${format(nextRb.cost)})</button>
                `;
                rbZone.appendChild(card);
            } else {
                rbZone.innerHTML = `<div style="font-size:12px; color:#55ff55; text-align:center; padding:10px;">✨ 宇宙の全再生段階（30/30）を完全超越しました！</div>`;
            }

            let eggList = document.getElementById("egg-list");
            eggList.innerHTML = "";
            eggsMaster.forEach(egg => {
                let isUnlocked = state.rebirths >= egg.reqRebirths;
                let card = document.createElement("div");
                card.className = `egg-card ${isUnlocked ? 'egg-unlocked' : ''}`;
                if (!isUnlocked) {
                    card.innerHTML = `
                        <div>
                            <div class="egg-title" style="color: #56698f;">🔒 未解禁の宇宙卵</div>
                            <div class="egg-req">条件: リバース回数 ${egg.reqRebirths}回</div>
                        </div>
                        <button class="buy-btn" disabled>ロック中</button>
                    `;
                } else {
                    card.innerHTML = `
                        <div>
                            <div class="egg-title">${egg.name}</div>
                            <div class="egg-req">必要条件達成済</div>
                        </div>
                        <button class="buy-btn" ${state.coins < egg.cost ? 'disabled' : ''} onclick="buyEgg(${egg.id})">孵化 (${format(egg.cost)})</button>
                    `;
                }
                eggList.appendChild(card);
            });

            let petList = document.getElementById("pet-list");
            petList.innerHTML = "";
            let hasPets = false;
            let bestPetId = -1;
            let bestMult = -1;

            for (let id in state.ownedPets) {
                if (state.ownedPets[id] > 0) {
                    let p = petsMaster.find(x => x.id == id);
                    if (p && p.multiplier > bestMult) {
                        bestMult = p.multiplier;
                        bestPetId = id;
                    }
                }
            }

            for (let id in state.ownedPets) {
                let qty = state.ownedPets[id];
                if (qty <= 0) continue;
                hasPets = true;
                let p = petsMaster.find(x => x.id == id);
                if (!p) continue;

                let isBest = (id == bestPetId);
                let row = document.createElement("div");
                row.className = "pet-item";
                row.innerHTML = `
                    <div>
                        <div class="pet-name">${p.name} <span style="color:#8fa0c0; font-size:11px;">(所持数: ${qty})</span></div>
                        <div class="pet-rarity rarity-${p.rarity}">${p.rarityName.toUpperCase()}</div>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                        <div class="pet-mult">生産倍率: x${format(p.multiplier)}</div>
                        ${isBest ? '<span class="active-badge">適用中 (最高倍率)</span>' : ''}
                    </div>
                `;
                petList.appendChild(row);
            }
            if (!hasPets) {
                petList.innerHTML = `<div style="color:#56698f; font-size:12px; text-align:center; padding:30px;">まだ相棒がいません。卵ガチャを回しましょう！</div>`;
            }

            let discoveredCount = state.discoveredDex.length;
            let totalPetsCount = petsMaster.length;
            let pct = (discoveredCount / totalPetsCount) * 100;
            document.getElementById("dex-title").innerText = `宇宙相棒図鑑 (${discoveredCount}/${totalPetsCount})`;
            document.getElementById("dex-pct-text").innerText = `達成率: ${pct.toFixed(2)}%`;
            document.getElementById("dex-bar").style.width = `${pct}%`;

            let dexGrid = document.getElementById("dex-grid");
            dexGrid.innerHTML = "";
            
            let displayLimit = Math.min(100, totalPetsCount);
            for (let i = 0; i < displayLimit; i++) {
                let p = petsMaster[i];
                let isFound = state.discoveredDex.includes(p.id);
                let box = document.createElement("div");
                box.className = `dex-box ${isFound ? 'discovered' : ''}`;
                if (isFound) {
                    box.innerHTML = `
                        <div style="font-weight:bold; color:#ffcc00;">No.${p.id}</div>
                        <div style="font-size:8px; text-align:center; margin-top:2px; max-width:90%; overflow:hidden; white-space:nowrap;">${p.rarityName}</div>
                    `;
                    box.title = p.name;
                } else {
                    box.innerHTML = `<div>No.${p.id}</div><div>???</div>`;
                }
                dexGrid.appendChild(box);
            }
            if (totalPetsCount > displayLimit) {
                let moreBox = document.createElement("div");
                moreBox.className = "dex-box";
                moreBox.style.gridColumn = "span 4";
                moreBox.style.aspectRatio = "auto";
                moreBox.style.padding = "10px";
                moreBox.innerText = `...他 ${(totalPetsCount - displayLimit)} 体のペット図鑑が背後に控えています...`;
                dexGrid.appendChild(moreBox);
            }
        }

        function saveGame() {
            localStorage.setItem("cosmic_clicker_save_v11", JSON.stringify(state));
        }

        function loadGame() {
            let saved = localStorage.getItem("cosmic_clicker_save_v11");
            if (saved) {
                try {
                    let parsed = JSON.parse(saved);
                    if (parsed.upgrades) state.upgrades = parsed.upgrades;
                    if (parsed.rebirths !== undefined) state.rebirths = parsed.rebirths;
                    if (parsed.coins !== undefined) state.coins = parsed.coins;
                    if (parsed.ownedPets) state.ownedPets = parsed.ownedPets;
                    if (parsed.discoveredDex) state.discoveredDex = parsed.discoveredDex;
                } catch(e) {
                    console.error("セーブデータの読み込みに失敗しました", e);
                }
            }
        }

        document.getElementById("click-target").addEventListener('click', (e) => {
            triggerClickEffect();
        });

        // 10秒おきに裏側オートセーブ
        setInterval(() => {
            saveGame();
        }, 1000);

        // 初始化
        initMasterData();
        loadGame();
        updateUI();
        requestAnimationFrame(runGameLoops);
    </script>
</body>
</html>
